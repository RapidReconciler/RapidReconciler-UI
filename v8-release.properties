# UI-211. What the V8 UI release cut from this commit needs, read by
# .github/scripts/package_v8_release.py when a ui-v* tag is pushed
# (.github/workflows/release-v8-ui.yml). The release refuses to publish without it.
#
# min-services-version: the oldest RapidReconciler Services release every V8 page
# runs against. VALC reads it from the release body ("RR-Min-Services-Version:")
# and checks it against EVERY active database in the environment, because one UI
# deployment serves them all.
#
# Raise it in the same PR as a UI change that calls an endpoint, field or
# behaviour a Services release added. "none" is refused: every V8 page calls
# Services.
#
# 8.0.47 (2026-10-05): the Services every dev database ran when the first UI
# release was cut. Nothing has measured that this UI works on an older one.
# 8.0.50 (2026-10-29, UI-218): the Transactions grid sends and reads a row's owner
# (assignedTo / AssignedTo), which only Services 8.0.50 (Agent #194) stores. An
# older Services drops the unknown field without an error, so an assignment would
# look saved and vanish. All three dev databases ran 8.0.50 when this was raised.
min-services-version=8.0.50
#
# docs-base-url: where a deployed V8 links the knowledge base (owner ruling 2026-11-03).
# The release zip serves at its own host's root, where ../RRUniversity/ names nothing,
# so the packager rewrites every link that leaves the zip (the help "?" panels, Home's
# RR University pill and search results, release notes) to this base, in the shipped
# copy only. The repo, and the :8765 dev server, keep their relative links. The
# Export Analyzer is not a link: it is framed and handed customer data, so it ships
# inside the zip. Change this when the knowledge base moves off GitHub Pages
# (QAv8 spec task 18), then cut a UI release.
docs-base-url=https://rapidreconciler.github.io/RapidReconciler-UI/
