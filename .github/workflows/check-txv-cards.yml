name: Txv card assertion gate

# Every `checked` line on a transaction-variance card cites the classifier
# assertion that backs it. The ids come from RRV8/txv-assertions.json, generated
# in RapidReconciler-DB from the `@asserts` lines in the usp8_txv_* procs. This
# job fails a card that claims something the SQL never tested.

on:
  push:
    branches: [main, Dev]
    paths:
      - 'RRV8/config.js'
      - 'RRV8/txv-assertions.json'
      - 'Tools/check_txv_cards.py'
      - 'Tools/_test_txv_gate/**'
      - '.github/workflows/check-txv-cards.yml'
  pull_request:
    paths:
      - 'RRV8/config.js'
      - 'RRV8/txv-assertions.json'
      - 'Tools/check_txv_cards.py'
      - 'Tools/_test_txv_gate/**'
      - '.github/workflows/check-txv-cards.yml'

permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test the gate
        run: python Tools/check_txv_cards.py --self-test

      - name: Check the card catalog
        run: python Tools/check_txv_cards.py
