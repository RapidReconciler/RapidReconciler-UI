# Analyzer fingerprint tests (schema-only).
#
# THIS SUITE WAS RED FROM AT LEAST 2026-06-08 TO 2026-09-02 AND COULD NOT PASS.
# `fingerprints.json` names 11 fixtures under `Tools/_test_corpus/fixtures/`,
# and that directory is gitignored at `.gitignore:20` -- deliberately, because
# real customer extracts get staged there. So the runner checked out a manifest
# naming 11 files that do not exist in CI, and failed on the first one, every
# time, on main included. Five consecutive failures were measured before this
# was fixed.
#
# The fix is to GENERATE the fixtures rather than commit them, which keeps the
# gitignore's data-hygiene guard intact by construction: the inputs are literals
# in a tracked script, so no customer bytes can enter. See make-fixtures.py.
#
# WHAT THIS SUITE DOES AND DOES NOT PROVE. It is schema-only -- it finds a
# header row in rows 1-3 and asserts the manifest's required headers are
# present. It never reads a data row and never calls a template's detect().
# It would NOT have caught the Pattern 5.4 false positive fixed on 2026-09-02,
# which was a behaviour defect. Treat a green run here as "the templates' header
# contracts still hold", not as analyzer coverage.
#
# `Tools/analyzer-engine.js` IS IN THE PATHS LIST BELOW, and was missing until
# 2026-09-02. The whole pattern-classification chain was split out of
# analysis-workbook.html into that file and the filter never followed, so a
# 193-line change to every pattern predicate ran none of this. Adding it was
# only safe once the suite could actually pass -- a required check that is
# always red is worse than a gap.

name: Analyzer fingerprint tests

on:
  push:
    branches: [main]
    paths:
      - 'Tools/analysis-workbook.html'
      - 'Tools/analyzer-engine.js'
      - 'Tools/_test_corpus/**'
      - '.github/workflows/analyzer-tests.yml'
  pull_request:
    paths:
      - 'Tools/analysis-workbook.html'
      - 'Tools/analyzer-engine.js'
      - 'Tools/_test_corpus/**'
      - '.github/workflows/analyzer-tests.yml'

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate schema fixtures
        # The fixtures are gitignored on purpose. This writes them from the
        # manifest, so the suite has something to test. On a developer box the
        # script SKIPS any fixture that already exists (a real extract must
        # never be clobbered); in CI the directory is empty, so all 11 are
        # created.
        run: |
          python -m pip install --quiet openpyxl
          python Tools/_test_corpus/make-fixtures.py

      - name: Assert every fixture exists before testing
        # A generator that silently wrote nothing would leave the suite failing
        # on a missing file and look identical to the bug this replaced. Count
        # the manifest against the disk before handing over to Node.
        run: |
          set -euo pipefail
          WANT=$(python -c "import json;print(len(json.load(open('Tools/_test_corpus/fingerprints.json'))['fixtures']))")
          GOT=$(find Tools/_test_corpus/fixtures -maxdepth 1 -name '*.xlsx' | wc -l)
          echo "manifest wants $WANT fixtures, $GOT present"
          if [ "$GOT" -lt "$WANT" ]; then
            echo "::error::only $GOT of $WANT fixtures were generated"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exceljs
        working-directory: Tools/_test_corpus
        run: |
          echo '{"type":"module"}' > package.json
          npm install exceljs --no-save --silent

      - name: Run fingerprint tests
        working-directory: Tools/_test_corpus
        run: node run-fingerprint-tests.mjs
