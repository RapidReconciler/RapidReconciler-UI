name: Refresh search indices

# Regenerates the three search indices (RR University, customer Help Desk
# scenarios, and GSI-tech install scenarios) whenever a relevant HTML file or
# build script changes on main, then lands the regenerated JSON through a
# PULL REQUEST rather than a direct push.
#
# WHY A PR AND NOT A PUSH (changed 2026-09-10, HK-14)
# ---------------------------------------------------
# `main` carries ruleset 22760277, which requires the `callsites` check.
# Required checks are evaluated on any ref update including a direct push, and
# a fresh bot commit has no checks on it. The repo is owned by a USER account,
# so the Integration bypass that would exempt github-actions[bot] is refused,
# and `enforcement: evaluate` is Enterprise-only on this plan. The bot goes
# through the front door instead. Full reasoning in update-release-notes.yml,
# which is the reference implementation of this pattern.
#
# ⚠ NEEDS BOT_PR_TOKEN, NOT GITHUB_TOKEN. GitHub's documented contract is that
# "events triggered by the GITHUB_TOKEN will not create a new workflow run",
# so a PR opened with it never triggers the required check and would sit at
# "Expected" forever. The preflight step refuses loudly rather than opening a
# PR that cannot merge.
#
# LOOP PREVENTION IS PATH-BASED HERE AND SURVIVES DROPPING `[skip ci]`, which
# had to go so the bot's own PR gets checked. The three index JSON files are
# deliberately NOT in the trigger paths below, so landing them cannot
# retrigger this workflow. The PR title is also kept in the
# "chore: refresh search indices" shape, because update-release-notes.yml and
# update-doc-dates.yml both key their job-level skip guards off that prefix.

on:
  push:
    branches: [main]
    paths:
      - 'RRUniversity/**.html'
      - 'RRUniversity/build-search-index.py'
      - 'Scenarios/**.html'
      - 'Scenarios/build-scenarios-index.py'
      - 'GSIRRTech/install-scenarios/**.html'
      - 'GSIRRTech/install-scenarios/build-install-scenarios-index.py'
      - '.github/workflows/refresh-indices.yml'
  # Also runnable on demand from the Actions tab
  workflow_dispatch:

# GITHUB_TOKEN needs nothing: the branch push, the PR and the merge all
# authenticate as BOT_PR_TOKEN. Left read-only so a reintroduced direct push
# fails rather than half-working.
permissions:
  contents: read

# If a second push lands while the first run is still going, queue the new run
# rather than running them in parallel — they'd just step on each other
concurrency:
  group: refresh-indices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # BEFORE checkout, so a missing secret fails with a cause rather than as
      # an opaque auth error inside actions/checkout.
      - name: Require BOT_PR_TOKEN
        env:
          BOT_PR_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$BOT_PR_TOKEN" ]; then
            echo "::error::BOT_PR_TOKEN is not set, so this workflow cannot land its change."
            echo "::error::It cannot fall back to a direct push: main's ruleset 22760277 requires"
            echo "::error::the 'callsites' check and a bot commit pushed straight to main has none."
            echo "::error::It cannot use GITHUB_TOKEN for the PR either, because a PR opened with"
            echo "::error::GITHUB_TOKEN never triggers the required check."
            echo "::error::Create a fine-grained token scoped to this repository with Contents"
            echo "::error::read/write and Pull requests read/write, save it as the Actions secret"
            echo "::error::BOT_PR_TOKEN, and re-run. Failing loudly on purpose: a silent skip"
            echo "::error::would let the search indices drift with nothing on screen to say so."
            exit 1
          fi
          echo "BOT_PR_TOKEN present."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # ⚠ CHECK OUT THE BRANCH TIP, NOT THE TRIGGER SHA. Without this,
          # actions/checkout uses `github.sha` -- the commit that fired the run --
          # and the run stays anchored to it however long it waited in the queue.
          # The `concurrency:` block below cannot help, because the anchor is set
          # when the push happens, not when the job starts.
          #
          # MEASURED on run 35210880574 (HK-20, 2026-09-17). Its job started at
          # 10:31:28, two seconds AFTER the previous run finished, and checked out
          # at 10:31:31 -- nine seconds AFTER that run's PR #625 merged as 8b56c85.
          # It still committed b30ac90e on top of b3d81c04, the pre-#625 main,
          # because b3d81c04 was its trigger sha. It then regenerated the same
          # single-line JSON files #625 had just rewritten, so PR #626 opened
          # `dirty` and could never merge.
          #
          # ⚠ AND A CONFLICTED PR GETS NO CHECKS AT ALL. GitHub builds the
          # `refs/pull/N/merge` ref that `pull_request` workflows run against; it
          # cannot build one for a conflicted PR, so zero checks register. Measured:
          # check-runs total_count on b30ac90e is 0. The wait loop below then spent
          # its full five minutes on a PR that was never going to get a check, and
          # blamed the token.
          #
          # The previous run, #625, was stale-parented too (head 13995ffe, parent
          # bc2b6dfc, while main was already b3d81c04). It merged only because the
          # two intervening commits touched release-notes.html and doc `<time>`
          # elements rather than the index files. Luck, not design.
          ref: ${{ github.ref_name }}
          # Configures origin with the PAT, so the branch push is authenticated
          # as a real user and DOES trigger the PR's checks.
          token: ${{ secrets.BOT_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet beautifulsoup4

      - name: Regenerate RR University search-index.json
        working-directory: RRUniversity
        run: python build-search-index.py

      - name: Regenerate Scenarios scenarios-index.json
        working-directory: Scenarios
        run: python build-scenarios-index.py

      - name: Regenerate install-scenarios-index.json
        working-directory: GSIRRTech/install-scenarios
        run: python build-install-scenarios-index.py

      - name: Open a PR and merge it once the checks pass
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RRUniversity/search-index.json \
                  Scenarios/scenarios-index.json \
                  GSIRRTech/install-scenarios/install-scenarios-index.json
          if git diff --staged --quiet; then
            echo "No index changes -- nothing to do."
            exit 0
          fi

          branch="bot/search-indices-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          # NO [skip ci], deliberately: a skipped run reports no checks, and a
          # required check that never reports blocks this PR permanently.
          git commit -m "chore: refresh search indices"
          git push -u origin "$branch"

          # The TITLE is what a squash merge writes onto main, and two sibling
          # workflows skip on this exact prefix. Do not reword it.
          pr_url="$(gh pr create \
            --base main --head "$branch" \
            --title "chore: refresh search indices" \
            --body "Opened by the search-index workflow. Lands the three regenerated index JSON files. Goes through a PR rather than a direct push because main's ruleset requires the \`callsites\` check and a direct bot push carries none. Merged automatically once the checks pass.")"
          echo "Opened $pr_url"
          pr_num="${pr_url##*/}"

          # ⚠ WAIT FOR A CHECK TO REGISTER BEFORE WATCHING ONE.
          # `gh pr checks --watch` returns IMMEDIATELY when zero checks exist:
          # it waits for EXISTING checks to finish, not for checks to appear.
          # Measured on this workflow's first real run -- it opened a PR, read
          # "no checks reported", and refused, while `callsites` was created 19
          # seconds later and passed. The refusal was correct for what it saw,
          # and leaving the PR open meant nothing was lost, but it could never
          # have merged. HANDOFF already carried the rule this violates: if a
          # workflow's triggers match, a missing check means WAIT, not a verdict.
          head_sha="$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid')"
          echo "head sha: $head_sha"
          # ⚠ A CONFLICTED PR NEVER GETS A CHECK, SO WAITING FIVE MINUTES FOR ONE
          # IS WAITING FOR SOMETHING THAT CANNOT ARRIVE. `pull_request` workflows
          # run against `refs/pull/N/merge`, which GitHub cannot build when the PR
          # conflicts. Measured on #626 (HK-20): mergeable_state `dirty`,
          # check-runs total_count 0, loop timed out at the full five minutes and
          # reported the token as the likely cause. The token was fine. Checked
          # inside the loop rather than once up front because `mergeable` is
          # computed asynchronously and reads `null` for the first second or two.
          registered=0
          for _ in $(seq 1 30); do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                  --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${n:-0}" -gt 0 ]; then registered=1; echo "$n check(s) registered."; break; fi
            mergeable="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_num}" \
                          --jq '.mergeable_state' 2>/dev/null || echo unknown)"
            if [ "$mergeable" = "dirty" ]; then
              echo "::error::$pr_url conflicts with ${GITHUB_REF_NAME} (mergeable_state: dirty)."
              echo "::error::Failing now rather than waiting out the five-minute check loop: a"
              echo "::error::conflicted PR has no refs/pull/N/merge ref, so pull_request checks"
              echo "::error::can never register on it. This is NOT a token problem."
              echo "::error::Cause to look at first: this run regenerated the indices on top of a"
              echo "::error::stale commit. The checkout step pins to the branch tip for exactly"
              echo "::error::this reason -- if that is still set and this fired anyway, main moved"
              echo "::error::between checkout and push. The PR is left open so the diff is visible."
              exit 1
            fi
            sleep 10
          done
          if [ "$registered" -ne 1 ]; then
            echo "::error::no check run registered for ${head_sha} within 5 minutes,"
            echo "::error::and the PR is not conflicted (mergeable_state: ${mergeable:-unknown})."
            echo "::error::With a required check that is indistinguishable from a permanent"
            echo "::error::block, so the PR is left open. Most likely cause: BOT_PR_TOKEN is a"
            echo "::error::GITHUB_TOKEN-equivalent and did not trigger the checks."
            exit 1
          fi

          # ⚠ GATED ON THE EXIT CODE, AND NEVER PIPED. `gh pr checks | tee`
          # returns tee's status and the default shell is `bash -e` with no
          # pipefail, so a red gate would be discarded. That is HK-8.
          out="${RUNNER_TEMP:-/tmp}/checks.txt"
          rc=0
          gh pr checks "$pr_num" --watch --fail-fast > "$out" 2>&1 || rc=$?
          cat "$out"

          # ⚠ AND EXIT 0 CAN BE A STALE READ -- measured on UI #539, where
          # --watch returned 0 quoting the previous head's run. Re-read the
          # verdict against the sha actually being merged.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                    --jq '[.check_runs[] | .conclusion] | join(",")')"
          echo "check-run conclusions for ${head_sha}: ${state:-<none>}"

          if [ "$rc" -ne 0 ] || echo ",$state," | grep -q ',failure,\|,cancelled,\|,timed_out,'; then
            echo "::error::checks did not pass on $pr_url (gh exit $rc, conclusions: ${state:-none})."
            echo "::error::Leaving the PR OPEN rather than merging or deleting it, so the indices"
            echo "::error::are recoverable and the failure is visible. Merging past a red check is"
            echo "::error::not this workflow's call."
            exit 1
          fi
          if [ -z "$state" ]; then
            echo "::error::no check runs reported for ${head_sha}. With a required check that is"
            echo "::error::indistinguishable from a permanent block, so the PR is left open."
            echo "::error::Most likely cause: BOT_PR_TOKEN did not trigger the checks."
            exit 1
          fi

          gh pr merge "$pr_num" --squash --delete-branch
          echo "Merged $pr_url"
