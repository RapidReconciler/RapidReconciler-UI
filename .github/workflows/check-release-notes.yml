name: Release notes renderer

# release-notes.html is customer-facing, and update-release-notes.yml writes it on
# every push to main with no human looking at the HTML. UI-208: the renderer joined
# every line of a note with spaces, so a "- " bulleted note published as one run-on
# paragraph, and 4 of the 10 entries on the page shipped that way unnoticed. This
# runs the renderer's tests BEFORE a change to it can reach main.
#
# ⚠ NO `paths:` FILTER, on purpose: a filtered workflow does not REPORT on a PR it
# skips, so it can never be a required check (the lesson check-v8-callsites.yml,
# UI #536, and check-js-syntax.yml paid for).

on:
  push:
    branches: [main, Dev]
  pull_request:

permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Renderer tests
        run: python .github/scripts/test_update_release_notes.py
