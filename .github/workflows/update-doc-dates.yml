name: Update doc dates

# For each customer-facing HTML file that changed on this push to main, refresh
# the "Last updated <date>" line in its banner from git's commit history, then
# land the result through a PULL REQUEST rather than a direct push. The script
# writes nothing for files whose dates are already current, so this is a no-op
# on pushes that didn't touch a customer doc.
#
# WHY A PR AND NOT A PUSH (changed 2026-09-10, HK-14)
# ---------------------------------------------------
# `main` carries ruleset 22760277, which requires the `callsites` check.
# Required checks are evaluated on any ref update including a direct push, and
# a fresh bot commit has no checks on it. The repo is owned by a USER account,
# so the Integration bypass that would exempt github-actions[bot] is refused,
# and `enforcement: evaluate` is Enterprise-only on this plan. Full reasoning
# in update-release-notes.yml, the reference implementation of this pattern.
#
# ⚠ NEEDS BOT_PR_TOKEN, NOT GITHUB_TOKEN: "events triggered by the
# GITHUB_TOKEN will not create a new workflow run", so a PR opened with it
# never triggers the required check and sits at "Expected" forever.
#
# ⚠ THE `[skip ci]` CLAUSE IN THE GUARD BELOW IS NOW REDUNDANT, AND THAT WAS
# CHECKED RATHER THAN ASSUMED. This job used to skip sibling bots partly by
# testing for [skip ci] in their commit messages, and those bots no longer
# carry it -- their branch commits cannot, or their own PRs would get no
# checks. Traced before removing anything: refresh-indices now lands
# "chore: refresh search indices" and update-release-notes lands
# "chore: append release notes ...", and this guard already refuses both by
# subject prefix. Their merges also touch only index JSON and release-notes.html,
# neither of which matches the paths below. So two independent guards remain
# and the [skip ci] clause is left in place as harmless belt-and-braces --
# not because anything depends on it.

on:
  push:
    branches: [main]
    # ⛔ THIS LIST MUST MATCH `DIRS` IN update_doc_dates.py, AND FOR MONTHS IT DID
    # NOT. GSIRRTech and GSIRRSales were absent here, so fifteen docs carrying a
    # doc-last-updated span were never once refreshed -- certificate-management
    # showed 2026-05-25 against a last commit of 2026-09-12. A directory missing
    # from this list is not half-wired, it is UNwired, and it fails silently and
    # permanently. The script now asserts this agreement on every run and exits 1
    # if the two drift again.
    paths:
      - 'RRUniversity/**.html'
      - 'Scenarios/**.html'
      - 'HelpDesk/**.html'
      - 'GSIRRTech/**.html'
      - 'GSIRRSales/**.html'
      - 'Tools/doc-header.css'
      - '.github/workflows/update-doc-dates.yml'
      - '.github/scripts/update_doc_dates.py'
  workflow_dispatch:

# GITHUB_TOKEN needs nothing: the branch push, the PR and the merge all
# authenticate as BOT_PR_TOKEN.
permissions:
  contents: read

concurrency:
  group: update-doc-dates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh doc dates') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh search indices') &&
      !startsWith(github.event.head_commit.message, 'chore: append release notes')

    steps:
      # BEFORE checkout, so a missing secret fails with a cause rather than as
      # an opaque auth error inside actions/checkout.
      - name: Require BOT_PR_TOKEN
        env:
          BOT_PR_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$BOT_PR_TOKEN" ]; then
            echo "::error::BOT_PR_TOKEN is not set, so this workflow cannot land its change."
            echo "::error::It cannot fall back to a direct push: main's ruleset 22760277 requires"
            echo "::error::the 'callsites' check and a bot commit pushed straight to main has none."
            echo "::error::It cannot use GITHUB_TOKEN for the PR either, because a PR opened with"
            echo "::error::GITHUB_TOKEN never triggers the required check."
            echo "::error::Create a fine-grained token scoped to this repository with Contents"
            echo "::error::read/write and Pull requests read/write, save it as the Actions secret"
            echo "::error::BOT_PR_TOKEN, and re-run. Failing loudly on purpose: a silent skip"
            echo "::error::would let every customer doc's Last-updated date drift with nothing"
            echo "::error::on screen to say so."
            exit 1
          fi
          echo "BOT_PR_TOKEN present."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the script can resolve last-commit-date per file
          fetch-depth: 0
          # Configures origin with the PAT, so the branch push is authenticated
          # as a real user and DOES trigger the PR's checks.
          token: ${{ secrets.BOT_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh last-updated dates
        run: python .github/scripts/update_doc_dates.py

      - name: Open a PR and merge it once the checks pass
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⛔ THIS IS THE THIRD COPY OF THE DIRECTORY LIST AND IT IS THE ONE THAT
          # DECIDES WHAT ACTUALLY LANDS. Found 2026-09-14: `DIRS` in the script,
          # `paths:` above, and this `git add` all enumerate the same thing
          # independently. Fixing only the first two would have had the script
          # rewrite GSIRRTech's dates in the working tree and then quietly fail to
          # stage a single one of them -- a green run that changes nothing, which
          # is worse than the red one it replaced. update_doc_dates.py now asserts
          # that all three agree and exits 1 if they do not.
          git add RRUniversity/*.html Scenarios/scenario-*.html HelpDesk/*.html \
                  GSIRRTech/*.html GSIRRSales/*.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No date changes -- nothing to do."
            exit 0
          fi

          branch="bot/doc-dates-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          # NO [skip ci], deliberately: a skipped run reports no checks, and a
          # required check that never reports blocks this PR permanently.
          git commit -m "chore: refresh doc dates"
          git push -u origin "$branch"

          # The TITLE is what a squash merge writes onto main, and this job's
          # own guard above refuses to re-run on this exact prefix. Do not
          # reword it, or this workflow will retrigger on its own merge.
          pr_url="$(gh pr create \
            --base main --head "$branch" \
            --title "chore: refresh doc dates" \
            --body "Opened by the doc-dates workflow. Lands refreshed Last-updated stamps on the customer docs that changed. Goes through a PR rather than a direct push because main's ruleset requires the \`callsites\` check and a direct bot push carries none. Merged automatically once the checks pass.")"
          echo "Opened $pr_url"
          pr_num="${pr_url##*/}"

          # ⚠ WAIT FOR A CHECK TO REGISTER BEFORE WATCHING ONE.
          # `gh pr checks --watch` returns IMMEDIATELY when zero checks exist:
          # it waits for EXISTING checks to finish, not for checks to appear.
          # Measured on this workflow's first real run -- it opened a PR, read
          # "no checks reported", and refused, while `callsites` was created 19
          # seconds later and passed. The refusal was correct for what it saw,
          # and leaving the PR open meant nothing was lost, but it could never
          # have merged. HANDOFF already carried the rule this violates: if a
          # workflow's triggers match, a missing check means WAIT, not a verdict.
          head_sha="$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid')"
          echo "head sha: $head_sha"
          registered=0
          for _ in $(seq 1 30); do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                  --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${n:-0}" -gt 0 ]; then registered=1; echo "$n check(s) registered."; break; fi
            sleep 10
          done
          if [ "$registered" -ne 1 ]; then
            echo "::error::no check run registered for ${head_sha} within 5 minutes."
            echo "::error::With a required check that is indistinguishable from a permanent"
            echo "::error::block, so the PR is left open. Most likely cause: BOT_PR_TOKEN is a"
            echo "::error::GITHUB_TOKEN-equivalent and did not trigger the checks."
            exit 1
          fi

          # ⚠ GATED ON THE EXIT CODE, AND NEVER PIPED. `gh pr checks | tee`
          # returns tee's status and the default shell is `bash -e` with no
          # pipefail, so a red gate would be discarded. That is HK-8.
          out="${RUNNER_TEMP:-/tmp}/checks.txt"
          rc=0
          gh pr checks "$pr_num" --watch --fail-fast > "$out" 2>&1 || rc=$?
          cat "$out"

          # ⚠ AND EXIT 0 CAN BE A STALE READ -- measured on UI #539, where
          # --watch returned 0 quoting the previous head's run. Re-read the
          # verdict against the sha actually being merged.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                    --jq '[.check_runs[] | .conclusion] | join(",")')"
          echo "check-run conclusions for ${head_sha}: ${state:-<none>}"

          if [ "$rc" -ne 0 ] || echo ",$state," | grep -q ',failure,\|,cancelled,\|,timed_out,'; then
            echo "::error::checks did not pass on $pr_url (gh exit $rc, conclusions: ${state:-none})."
            echo "::error::Leaving the PR OPEN rather than merging or deleting it, so the stamps"
            echo "::error::are recoverable and the failure is visible. Merging past a red check is"
            echo "::error::not this workflow's call."
            exit 1
          fi
          if [ -z "$state" ]; then
            echo "::error::no check runs reported for ${head_sha}. With a required check that is"
            echo "::error::indistinguishable from a permanent block, so the PR is left open."
            echo "::error::Most likely cause: BOT_PR_TOKEN did not trigger the checks."
            exit 1
          fi

          gh pr merge "$pr_num" --squash --delete-branch
          echo "Merged $pr_url"
