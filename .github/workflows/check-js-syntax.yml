name: Check JS syntax and behaviour

# A typo inside an inline <script> is SILENT in a browser. The block stops
# executing, the page still renders, and the feature quietly does nothing. There
# is no build step on this repo to catch it, so nothing did.
#
# Tools/parsecheck.py compiles every inline <script> (and every .js) with V8 --
# the browser's own parser -- via `new vm.Script`, which compiles WITHOUT
# executing. No DOM, no network, no side effects.
#
# WHY THIS IS ONLY NOW WIRED UP (UI-111). The tool used to run on esprima 4,
# which stops at ES2017 and therefore cannot parse optional chaining. It
# returned FAIL on every run against any file containing `a?.b`, which is zero
# coverage of exactly the files that most need checking. A tool that is always
# red is a tool nobody runs. It now prefers V8 and only falls back to esprima
# when no Node-compatible binary exists, announcing loudly when it does and
# labelling those findings FAIL? instead of FAIL.
#
# PARSECHECK_V8=node: ubuntu-latest ships Node, and the tool accepts either a
# path or a bare command name. Without this the job would silently drop to the
# blind engine, so the step also asserts the engine line says v8.
#
# Baseline at wire-up: 322 files (282 .html + 40 .js), all OK.
#
# THE `paths:` FILTERS WERE REMOVED 2026-09-10, for the two reasons already
# written out at length in check-v8-callsites.yml. Both apply here verbatim.
#
# 1. A FILTER SUPPRESSES THE REPORT, NOT JUST THE RUN. If this gate is ever
#    made a required check on main, a PR matching no path produces no check
#    at all, and GitHub parks a required check with no report at "Expected --
#    waiting for status to be reported". The merge button never lights up.
#    That is the prerequisite this change exists to satisfy: parsecheck is
#    the more valuable gate to require, because a syntax error inside an
#    inline <script> is silent -- the block stops executing, the page still
#    renders, and the feature quietly does nothing.
#
# 2. THE FILTER WAS THE WRONG SHAPE ANYWAY, and this one is even clearer
#    than the callsites case. The step below builds its file list from
#    `git ls-files '*.html' '*.js'` -- the whole TRACKED set, not the diff.
#    So the job already asserts the state of the entire tree and takes
#    nothing from the change. Path-filtering a whole-tree assertion makes
#    the check's answer depend on which files the author happened to edit,
#    which is not what the check means.
#
# Measured before removing them, 2026-09-10, on this box against the real
# V8 host (engine line: `v8 9.1.269.39-electron.0`): the same whole-tree
# command the step runs reports **187 files, 187 OK, exit 0**. So running
# unconditionally cannot turn a PR red on pre-existing content.
#
# ⚠ THE MEASUREMENT WAS WRONG ON ITS FIRST PASS AND THE TOOL SAID SO. Run
# with `PARSECHECK_V8=node` on a box where node is not on PATH, the override
# defeats host discovery, the tool drops to esprima 4 (ES2017, cannot parse
# `?.` or `??`) and reports 11 failures -- every one marked `FAIL?` under a
# warning header saying they may not be real. Read the engine line before
# believing a count from this tool.
#
# ⚠ Do not "optimise" this back to a paths filter. If the noise ever matters,
# the correct shape is a job that ALWAYS runs and decides internally whether
# there is work to do -- so the check still reports -- never a trigger filter
# that suppresses the report itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax-check every inline script and .js
        env:
          PARSECHECK_V8: node
        run: |
          # git ls-files, not find: it is exactly the TRACKED set, so it skips
          # gitignored paths automatically (.claude/worktrees holds full stale
          # copies of the repo locally, and Tools/_test_corpus holds customer
          # fixtures) and a local run checks the same files as CI. Absolute paths
          # because that is the tool's stated contract.
          mapfile -t files < <(git ls-files -z '*.html' '*.js' \
            | tr '\0' '\n' | sed "s|^|$PWD/|" | sort)
          echo "checking ${#files[@]} tracked files"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files matched; the gate would pass vacuously"
            exit 1
          fi
          # ⚠ THIS USED TO BE `python Tools/parsecheck.py ... | tee parsecheck.out`,
          # AND THAT GATE COULD NOT FAIL ON A SYNTAX ERROR. (HK-11 sweep 5, 2026-09-04.)
          #
          # A pipeline's exit status is the LAST command's, and `tee` returns 0 almost
          # always. GitHub's default shell is `bash -e {0}` with NO `-o pipefail`, so
          # parsecheck's exit 1 was discarded, the engine check below still passed
          # (V8 had run - it just reported failures), and the job went green.
          #
          # Measured on this box, with a control:
          #     parsecheck badsyntax.js            -> EXIT 1, prints FAIL
          #     parsecheck badsyntax.js | tee out  -> EXIT 0   <-- what the job saw
          #     parsecheck a-good-file.js          -> EXIT 0   (control)
          #
          # This is the same lost-exit-code family as HK-8, whose rule in the workspace
          # CLAUDE.md already says it plainly: never pipe the command whose status you
          # are gating on - redirect to a file and read it back. Doing exactly that.
          rc=0
          python Tools/parsecheck.py "${files[@]}" > parsecheck.out 2>&1 || rc=$?
          cat parsecheck.out

          # The gate is only meaningful if V8 actually ran. A fallback to esprima
          # would report unreal failures on every file using ?. -- fail the job on
          # the engine, not just on the verdicts. Checked FIRST, because a crashed
          # parsecheck produces neither an engine line nor trustworthy verdicts.
          if ! grep -q '^engine: v8' parsecheck.out; then
            echo "::error::parsecheck did not run on V8; the result cannot be trusted"
            exit 1
          fi

          # And now the verdicts, which is the thing this job is named after.
          if [ "$rc" -ne 0 ]; then
            echo "::error::parsecheck reported at least one file that does not parse (exit $rc). The FAIL lines are above."
            exit "$rc"
          fi

      # Neither syntax nor behaviour: the BYTES. RRV8/config.js was the only
      # mixed-ending blob in the repository, because Tools/build-ai-grounding.py
      # rewrites a block inside it with write_text(newline="") and the block's
      # endings disagreed with the file's. The symptom was not a broken page, it was
      # the grounding bot proposing the same 678-line carriage-return-only diff on
      # every run -- noise indistinguishable at a glance from a real regeneration,
      # which is what makes it expensive rather than merely untidy.
      # `*.js text eol=lf` in .gitattributes fixes it by normalising on staging.
      # Deleting that line silently restores the churn, so it needs a sink. This is it.
      # Runs BEFORE the behaviour tests because it is cheap and its failure explains
      # a whole class of confusing diffs the other steps would say nothing about.
      - name: Line endings (.gitattributes normalisation)
        run: python Tools/check_line_endings.py

      # Syntax is not behaviour. RRV8.rollForward's failure mode is a row counted as
      # NEITHER a break nor unevaluated, which draws as a benign neutral chip -- valid
      # JavaScript that parsecheck cannot see. That has happened twice now (the '' -> 'yes'
      # fallback, and the 'end' token in UI-57), on the one producer both Home's band and
      # the roll-forward page read. So the classifier gets asserted, not just parsed.
      # EVERY Tools/test-*.js, by glob, not by name. This step used to name
      # test-rollforward-classify.js alone, and measured 2026-08-26 that meant SEVEN of
      # the eight behaviour tests in the repo had never run in CI: analyst-company-switch,
      # audit-pdf-links, audit-strip-scope, nonstock-glclass, oe-compose, residual-dust
      # and variance-tieout. All eight pass, so nothing was hiding behind that -- but a
      # suite nobody executes is a suite that rots quietly, and the next author to add one
      # would have had to know to edit this file or their test would never run either.
      # The glob means a new test is wired by existing.
      #
      # Fails on the FIRST failing file and reports which, rather than masking later
      # failures behind an early exit or, worse, letting a non-zero exit vanish in a pipe.
      # HK-18. Neither syntax nor bytes: a class NAME in markup that nothing
      # styles. I wrote `class="callout is-wide"` into a document going to a
      # third party on 2026-09-15 -- `is-wide` does not exist, I built it by
      # analogy from `is-warn`/`is-shown`, and the real class `.callout.warning`
      # was in the same stylesheet the whole time. Nothing would have stopped
      # it; a grep I happened to run did.
      #
      # ⛔ THE BASELINE IS THE OWNER'S RULING (2026-09-15) AND NOT A DODGE.
      # `orphan-selectors.py` reports 209 orphans on home.html alone in the
      # OTHER direction, so this codebase already tolerates loose class
      # hygiene, and a gate that arrives red on a large backlog gets baselined
      # into silence within a week. Baseline what exists; fail on what is new.
      #
      # ⚠ THE BACKLOG IS MUCH SMALLER THAN THAT 209 SUGGESTED: 108 across 141
      # pages, home.html 17. Measured, not estimated -- the first run said 119
      # because the extractor was reading `'<div class="msg-card sev-' + sev`
      # as a class called `sev-`. Clearing 108 is a real option; see the
      # worklist row.
      #
      # The self-test runs FIRST and separately. Its verdicts are not worth
      # believing until its own parsers are asserted, and both directions of
      # the baseline are mutation-controlled inside it (all-baselined must go
      # green, empty-baselined must go red).
      - name: Unbacked markup classes (self-test first)
        run: python Tools/orphan-selectors.py --self-test

      - name: Unbacked markup classes vs the baseline
        run: |
          set -u
          mapfile -t pages < <(git ls-files -z '*.html' | tr '\0' '\n' | sort)
          echo "checking ${#pages[@]} tracked page(s)"
          if [ "${#pages[@]}" -eq 0 ]; then
            echo "::error::no HTML matched; the gate would pass vacuously"
            exit 1
          fi
          # Not piped. `gh pr checks | head` reporting exit 0 on a red PR is
          # the same lost-exit-code family this file already carries a note
          # about at the parsecheck step.
          rc=0
          python Tools/orphan-selectors.py --unbacked \
            --baseline Tools/unbacked-classes-baseline.txt "${pages[@]}" \
            > unbacked.out 2>&1 || rc=$?
          cat unbacked.out
          if [ "$rc" -ne 0 ]; then
            echo "::error::a markup class has no CSS rule and is not in"
            echo "::error::Tools/unbacked-classes-baseline.txt. The UNBACKED lines above"
            echo "::error::name the class and the line. Look it up before deciding it is"
            echo "::error::fine -- regenerating the baseline to clear this is how the"
            echo "::error::file stops meaning anything."
            exit "$rc"
          fi

      - name: Behaviour tests (Tools/test-*.js)
        run: |
          set -u
          found=0
          failed=""
          for f in Tools/test-*.js; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            echo "--- $f"
            if ! node "$f"; then failed="$failed $f"; fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Tools/test-*.js found -- the suite has vanished, which is itself a failure."
            exit 1
          fi
          echo "ran $found behaviour test file(s)"
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
