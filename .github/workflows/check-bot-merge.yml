name: Bot merge retry

# .github/scripts/merge_bot_pr.py is the one place the four bot workflows
# (refresh-ai-grounding, refresh-indices, update-doc-dates, update-release-notes)
# merge their PRs. It retries a merge refused with "Base branch was modified" and
# must never merge past a check that is not green (HK-34). Those bots only run on
# pushes to main, so a broken script would first show up as a bot PR left open.
# This runs its tests, mutation arms included, before a change can reach main.
#
# ⚠ NO `paths:` FILTER, on purpose: a filtered workflow does not REPORT on a PR it
# skips, so it can never be a required check (the lesson check-v8-callsites.yml,
# UI #536, and check-js-syntax.yml paid for).

on:
  push:
    branches: [main, Dev]
  pull_request:

permissions:
  contents: read

jobs:
  botmerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge-retry tests
        run: python .github/scripts/test_merge_bot_pr.py
