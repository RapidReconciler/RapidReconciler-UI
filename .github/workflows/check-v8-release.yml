name: V8 release packager

# UI-211. release-v8-ui.yml packages the V8 surface on a ui-v* tag and refuses when a
# page loads a file that does not exist, or when v8-release.properties declares no
# Services floor. Finding that out at tag time is late, so this runs the packager's
# tests on every PR: a fixture with a known file list, every refusal path, and the
# measurement of this repository's own V8 surface.
#
# ⚠ NO `paths:` FILTER, on purpose: a filtered workflow does not REPORT on a PR it
# skips, so it can never be a required check (check-v8-callsites.yml, UI #536).

on:
  push:
    branches: [main, Dev]
  pull_request:

permissions:
  contents: read

jobs:
  packager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Packager tests
        run: python .github/scripts/test_package_v8_release.py
