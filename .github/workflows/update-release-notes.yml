name: Update release notes

# Appends a new entry to release-notes.html for each non-skip commit pushed to
# main, then lands the regenerated page through a PULL REQUEST rather than a
# direct push.
#
# WHY A PR AND NOT A PUSH (changed 2026-09-10, HK-14)
# ---------------------------------------------------
# `main` now carries ruleset 22760277, which requires the `callsites` status
# check. Required status checks are evaluated on ANY ref update, including a
# direct push, and a freshly created bot commit has no checks on it. The repo
# is owned by a USER account, not an organisation, so the Integration bypass
# that would have exempted github-actions[bot] is refused outright:
# "Actor GitHub Actions integration must be part of the ruleset source or
# owner organization". There is no owner organisation. `enforcement: evaluate`
# is Enterprise-only on this plan, so there was no dry-run either.
#
# So the bot goes through the front door: branch, PR, wait for the checks it
# is subject to, merge on green.
#
# ⚠ AND THAT REQUIRES A TOKEN THAT IS NOT `GITHUB_TOKEN`. GitHub's documented
# contract: "events triggered by the GITHUB_TOKEN will not create a new
# workflow run", with only workflow_dispatch / repository_dispatch and
# approval-gated pull_request events excepted. A PR opened with GITHUB_TOKEN
# therefore never triggers `callsites`, and a required check that never
# reports leaves the PR at "Expected -- waiting for status to be reported"
# forever. `allow_auto_merge` is also false on this repo, so there is no
# merge-on-green fallback. BOT_PR_TOKEN is the credential; the preflight step
# below refuses loudly rather than opening a PR that cannot ever merge.
#
# LOOP PREVENTION DOES NOT DEPEND ON `[skip ci]`, WHICH IS WHY IT COULD BE
# DROPPED. It had to be: a branch commit carrying [skip ci] gets no checks, so
# the required check never reports and the bot's own PR blocks. Two guards
# remain, both independent of it:
#   1. paths-ignore on the trigger filters pushes that only touch the index
#      JSON files or release-notes.html itself -- and the merge of this bot's
#      PR touches nothing else.
#   2. The job-level if: refuses to run on commits whose subject starts with
#      "chore: append release notes" or "chore: refresh search indices", or
#      whose message contains [skip release notes] / [skip-release-notes].
#      The PR title below is what a squash merge writes onto main, so it is
#      deliberately kept in that shape.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'RRUniversity/search-index.json'
      - 'Scenarios/scenarios-index.json'
      - 'GSIRRTech/install-scenarios/install-scenarios-index.json'
      - 'release-notes.html'
  # Manual trigger for backfills or re-runs.
  workflow_dispatch:
    inputs:
      since:
        description: 'Commit SHA to start from (exclusive). Leave blank to use HEAD~1.'
        required: false
        default: ''

# GITHUB_TOKEN needs nothing here any more: the branch push, the PR and the
# merge all authenticate as BOT_PR_TOKEN. Left read-only so an accidental
# reintroduction of a direct push fails instead of half-working.
permissions:
  contents: read

# Queue concurrent runs so one push can't overwrite another's appended entry
concurrency:
  group: update-release-notes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The PR waits on real check runs. Bounded so a stuck check cannot hold a
    # runner for six hours.
    timeout-minutes: 20
    if: >-
      !contains(github.event.head_commit.message, '[skip release notes]') &&
      !contains(github.event.head_commit.message, '[skip-release-notes]') &&
      !startsWith(github.event.head_commit.message, 'chore: append release notes') &&
      !startsWith(github.event.head_commit.message, 'chore: refresh search indices')

    steps:
      # BEFORE checkout, so a missing secret fails with a cause rather than as
      # a confusing auth error inside actions/checkout.
      - name: Require BOT_PR_TOKEN
        env:
          BOT_PR_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          if [ -z "$BOT_PR_TOKEN" ]; then
            echo "::error::BOT_PR_TOKEN is not set, so this workflow cannot land its change."
            echo "::error::It cannot fall back to a direct push: main's ruleset 22760277 requires"
            echo "::error::the 'callsites' check, and a bot commit pushed straight to main has no"
            echo "::error::checks on it. It cannot use GITHUB_TOKEN for the PR either, because a"
            echo "::error::PR opened with GITHUB_TOKEN never triggers the required check."
            echo "::error::Create a fine-grained token scoped to this repository with Contents"
            echo "::error::read/write and Pull requests read/write, save it as the Actions secret"
            echo "::error::BOT_PR_TOKEN, and re-run. Failing loudly on purpose: silently skipping"
            echo "::error::would let release notes drift with nothing on screen to say so."
            exit 1
          fi
          echo "BOT_PR_TOKEN present."

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the script can resolve BEFORE..AFTER ranges and
          # not just the shallow tip
          fetch-depth: 0
          # ⚠ THE BRANCH TIP, NOT THE TRIGGER SHA. Default checkout pins the run
          # to `github.sha`, so a queued run still commits onto the commit that
          # fired it and opens a PR that conflicts with a main that has moved.
          # Measured on refresh-indices run 35210880574 (HK-20, 2026-09-17) --
          # full reasoning in the matching comment in refresh-indices.yml.
          #
          # ⚠ This does NOT move the commit range. The script still walks
          # `github.event.before..github.sha`, which is exactly the set of commits
          # that push introduced whatever the tip is now, and `fetch-depth: 0`
          # guarantees both ends are present. What changes is that
          # release-notes.html is read from the tip, so a sibling run's entry is
          # prepended to rather than overwritten.
          ref: ${{ github.ref_name }}
          # Configures the origin remote with the PAT, so the branch push below
          # is authenticated as a real user and DOES trigger the PR's checks.
          token: ${{ secrets.BOT_PR_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Append new release-note entries
        env:
          # github.event.before is unset on workflow_dispatch; fall back to the
          # manual input, and ultimately to HEAD~1 inside the script.
          BEFORE: ${{ github.event.before || inputs.since }}
          AFTER: ${{ github.sha }}
        run: |
          python .github/scripts/update_release_notes.py "$BEFORE" "$AFTER"

      - name: Open a PR and merge it once the checks pass
        env:
          GH_TOKEN: ${{ secrets.BOT_PR_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-notes.html
          if git diff --staged --quiet; then
            echo "No release-notes changes -- nothing to do."
            exit 0
          fi

          branch="bot/release-notes-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          # NO [skip ci] on this commit, deliberately. See the header: a
          # skipped run reports no checks, and a required check that never
          # reports blocks this PR permanently.
          git commit -m "chore: append release notes [skip release notes]"
          git push -u origin "$branch"

          # The TITLE is what a squash merge writes onto main, so it must keep
          # the shape the job-level if: above refuses to re-run on.
          pr_url="$(gh pr create \
            --base main --head "$branch" \
            --title "chore: append release notes [skip release notes]" \
            --body "Opened by the release-notes workflow. Lands one appended entry in \`release-notes.html\`. Goes through a PR rather than a direct push because main's ruleset requires the \`callsites\` check and a direct bot push carries none. Merged automatically once the checks pass.")"
          echo "Opened $pr_url"
          pr_num="${pr_url##*/}"

          # ⚠ WAIT FOR A CHECK TO REGISTER BEFORE WATCHING ONE.
          # `gh pr checks --watch` returns IMMEDIATELY when zero checks exist:
          # it waits for EXISTING checks to finish, not for checks to appear.
          # Measured on this workflow's first real run -- it opened a PR, read
          # "no checks reported", and refused, while `callsites` was created 19
          # seconds later and passed. The refusal was correct for what it saw,
          # and leaving the PR open meant nothing was lost, but it could never
          # have merged. HANDOFF already carried the rule this violates: if a
          # workflow's triggers match, a missing check means WAIT, not a verdict.
          head_sha="$(gh pr view "$pr_num" --json headRefOid --jq '.headRefOid')"
          echo "head sha: $head_sha"
          # ⚠ A CONFLICTED PR NEVER GETS A CHECK. `pull_request` workflows run
          # against `refs/pull/N/merge`, which GitHub cannot build for a PR that
          # conflicts, so zero checks register and this loop burns its full five
          # minutes blaming the token. Measured on refresh-indices #626 (HK-20,
          # 2026-09-17): mergeable_state `dirty`, check-runs total_count 0.
          # Read inside the loop because `mergeable` is computed asynchronously
          # and reads `null` for the first second or two after the PR opens.
          registered=0
          for _ in $(seq 1 30); do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                  --jq '.total_count' 2>/dev/null || echo 0)"
            if [ "${n:-0}" -gt 0 ]; then registered=1; echo "$n check(s) registered."; break; fi
            mergeable="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_num}" \
                          --jq '.mergeable_state' 2>/dev/null || echo unknown)"
            if [ "$mergeable" = "dirty" ]; then
              echo "::error::$pr_url conflicts with ${GITHUB_REF_NAME} (mergeable_state: dirty)."
              echo "::error::Failing now rather than waiting out the check loop: a conflicted PR"
              echo "::error::has no refs/pull/N/merge ref, so checks can never register on it."
              echo "::error::This is NOT a token problem. Most likely main moved between this"
              echo "::error::run's checkout and its push. The PR is left open so the diff shows."
              exit 1
            fi
            sleep 10
          done
          if [ "$registered" -ne 1 ]; then
            echo "::error::no check run registered for ${head_sha} within 5 minutes,"
            echo "::error::and the PR is not conflicted (mergeable_state: ${mergeable:-unknown})."
            echo "::error::With a required check that is indistinguishable from a permanent"
            echo "::error::block, so the PR is left open. Most likely cause: BOT_PR_TOKEN is a"
            echo "::error::GITHUB_TOKEN-equivalent and did not trigger the checks."
            exit 1
          fi

          # ⚠ GATED ON THE EXIT CODE, AND NEVER PIPED. `gh pr checks | tee` returns
          # tee's status, and the default shell here is `bash -e` with no
          # pipefail, so a red gate would be discarded and this would merge past
          # it. That is HK-8, which merged Valc #224 past a failing scan.
          out="${RUNNER_TEMP:-/tmp}/checks.txt"
          rc=0
          gh pr checks "$pr_num" --watch --fail-fast > "$out" 2>&1 || rc=$?
          cat "$out"

          # ⚠ AND EXIT 0 CAN BE A STALE READ. Measured 2026-09-10 on UI #539:
          # --watch returned 0 quoting the PREVIOUS head's run while the new
          # sha's checks were still in_progress. Re-read the verdict against
          # the sha actually being merged before trusting it.
          state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" \
                    --jq '[.check_runs[] | .conclusion] | join(",")')"
          echo "check-run conclusions for ${head_sha}: ${state:-<none>}"

          if [ "$rc" -ne 0 ] || echo ",$state," | grep -q ',failure,\|,cancelled,\|,timed_out,'; then
            echo "::error::checks did not pass on $pr_url (gh exit $rc, conclusions: ${state:-none})."
            echo "::error::Leaving the PR OPEN rather than merging or deleting it, so the entry is"
            echo "::error::recoverable and the failure is visible. Merging past a red check is not"
            echo "::error::this workflow's call."
            exit 1
          fi
          if [ -z "$state" ]; then
            echo "::error::no check runs reported for ${head_sha}. With a required check that is"
            echo "::error::indistinguishable from a permanent block, so the PR is left open."
            echo "::error::Most likely cause: BOT_PR_TOKEN is a GITHUB_TOKEN-equivalent and did"
            echo "::error::not trigger the checks."
            exit 1
          fi

          gh pr merge "$pr_num" --squash --delete-branch
          echo "Merged $pr_url"
